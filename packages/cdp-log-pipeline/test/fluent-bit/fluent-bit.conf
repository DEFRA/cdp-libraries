# Harness for test-against-real-fluent-bit.sh: real Fluent Bit running the real
# cdp-fluentbit filters, fed from stdin and printing to stdout instead of AWS.

[SERVICE]
    Flush        1
    Log_Level    warn
    Parsers_File /fluent-bit/etc/parsers.conf

# FireLens hands each app stdout line to Fluent Bit as {"log": "<line>"}.
# stdin drops records over 16KB by default; production's forward input
# allows 1MB (cdp-fluentbit fluent-bit.conf, Buffer_Chunk_Size 1M).
[INPUT]
    Name        stdin
    Tag         app
    Buffer_Size 1M

# parse-json.conf from cdp-fluentbit without its Firehose [OUTPUT],
# written by test-against-real-fluent-bit.sh on every run
@INCLUDE /cfg/parse-json-filters.conf

# The date key's name shows which route (tag) the record took
[OUTPUT]
    Name          stdout
    Match         app
    Format        json_lines
    json_date_key route_app

[OUTPUT]
    Name          stdout
    Match         audit
    Format        json_lines
    json_date_key route_audit
